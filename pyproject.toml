[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prompter-cli"
version = "0.2.0"
description = "Turn a raw prompt into a production-ready prompt, optimized for cache hits and speed."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "YESSS-STAR" }]
keywords = ["prompt", "prompt-engineering", "llm", "openai", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Utilities",
]
dependencies = ["openai>=1.50.0"]

[project.scripts]
optimize = "prompt_optimizer.cli:main"

[project.urls]
Homepage = "https://github.com/YESSS-STAR/prompter-cli"
Issues = "https://github.com/YESSS-STAR/prompter-cli/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_optimizer"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]
